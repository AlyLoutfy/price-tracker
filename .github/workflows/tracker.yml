name: Price Tracker

on:
  schedule:
    # Every hour. Fetches go straight to the site — nothing metered to conserve — so the only cost
    # is a runner minute. GitHub may delay scheduled runs under load; this is best-effort.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send only a Telegram connection test
        type: boolean
        default: false

# Prevent overlapping runs from racing on the committed state file.
concurrency:
  group: price-tracker
  cancel-in-progress: false

permissions:
  contents: write # needed to commit state/seen.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    # Every network call has its own timeout; this is only a backstop against a hung runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The branch's CURRENT tip, not the commit this run was triggered on. GitHub sometimes
          # fires the same schedule twice; the concurrency group makes the second wait, but by
          # default it would then check out the pre-first-run commit — without the first run's
          # state/seen.json — and re-send every alert the first run just sent (seen 2026-07-20).
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck && npm test

      - name: Install Chromium for Dubizzle
        if: ${{ !inputs.test_telegram }}
        run: npx playwright install --with-deps --no-shell chromium

      - name: Verify browser challenge handling
        if: ${{ !inputs.test_telegram }}
        run: npm run test:browser

      - name: Send Telegram test
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run telegram:test

      - name: Check listings and product discounts
        if: ${{ !inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Persist seen state
        # Also after a failed run: alerts already delivered before the failure are recorded in the
        # state file, and dropping it would re-send them next hour.
        if: ${{ !cancelled() && !inputs.test_telegram }}
        run: |
          if [[ -n "$(git status --porcelain state/seen.json)" ]]; then
            git config user.name "AlyLoutfy"
            git config user.email "109591758+AlyLoutfy@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update tracking state [skip ci]"
            # main may have moved during the run (a config change, a merge): replay onto it rather
            # than fail the push and lose this run's bookkeeping.
            for attempt in 1 2 3; do
              git pull --rebase --quiet && git push && exit 0
              sleep $((attempt * 5))
            done
            echo "Could not push state after 3 attempts" >&2
            exit 1
          else
            echo "No state changes to persist."
          fi
